# BinanceSpotManager : interface Streamlit + worker, un seul hote.
#
# Les deux services partagent les volumes data/ et logs/ : file de commandes,
# journal d'intentions d'ordres (SQLite) et verrou anti double-worker. Ne pas
# lancer plusieurs replicas du worker, ni deplacer ces volumes sur un partage
# reseau : les verrous de fichiers et SQLite exigent un seul noyau.

name: binance-spot-manager

# Durcissement commun aux services longs (ui, worker) et a l'outil de cles :
# aucun privilege supplementaire, aucune capacite Linux, systeme de fichiers en lecture seule
# (verifie hors Docker : Streamlit n'ecrit que dans data/ et logs/), /tmp en memoire,
# nombre de processus borne, journaux Docker tournants.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app: &app
  <<: *hardening
  build: .
  image: binance-spot-manager:latest
  init: true
  env_file:
    - path: .env
      required: false
  environment:
    BSM_WORKER_SUPERVISOR: docker
    # Avis CSI : API locale de CryptoSignalIntelligence (lecture et evaluation seulement),
    # jointe par le reseau partage csi-bridge. Le jeton facultatif vient de .env.
    BSM_CSI_API_URL: ${BSM_CSI_API_URL:-http://csi-api:8503}
    CSI_API_TOKEN: ${CSI_API_TOKEN:-}
    # Cle maitresse du coffre (cles API saisies dans Settings, secrets TOTP) : volume separe
    # des donnees, donc absent des sauvegardes (make backup) ; monte en LECTURE SEULE ici.
    # Seul l'outil ponctuel keytool (make master-key) peut l'ecrire.
    BSM_MASTER_KEY_FILE: /var/lib/bsm-keys/master.key
  volumes:
    - bsm-data:/app/data
    - bsm-logs:/app/logs
    - bsm-keys:/var/lib/bsm-keys:ro
  networks:
    - default
    - csi-bridge
  restart: unless-stopped

services:
  worker:
    <<: *app
    command: ["python", "scripts/bot_worker.py"]
    # Laisse le worker terminer sa boucle en cours apres SIGTERM.
    stop_grace_period: 30s
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "scripts/worker_healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  ui:
    <<: *app
    # scrypt (connexion) utilise 128 Mio par tentative : marge pour quelques connexions simultanees.
    mem_limit: 1g
    cpus: 1.0
    ports:
      # Interface privee : jamais exposee au reseau local.
      - "127.0.0.1:${BSM_UI_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Surveillance du worker (« bot muet ») : service separe, donnees en LECTURE SEULE, aucun port, aucune cle
  # (ni volume bsm-keys) ; prevenir sur Telegram si le worker se tait, s'arrete ou reste en veille avec des
  # positions ouvertes. Signal externe facultatif : BSM_HEALTHCHECK_URL dans .env.
  watchdog:
    <<: *app
    command: ["python", "scripts/watchdog.py"]
    mem_limit: 192m
    cpus: 0.25
    # Moindre privilège : pas de .env entier (clés Binance), seulement de quoi prévenir et la cadence du worker.
    env_file: !reset []
    environment:
      BSM_WORKER_SUPERVISOR: docker
      BSM_HEALTHCHECK_URL: ${BSM_HEALTHCHECK_URL:-}
      BSM_TELEGRAM_BOT_TOKEN: ${BSM_TELEGRAM_BOT_TOKEN:-}
      BSM_TELEGRAM_CHAT_ID: ${BSM_TELEGRAM_CHAT_ID:-}
      BSM_SMTP_HOST: ${BSM_SMTP_HOST:-}
      BSM_SMTP_PORT: ${BSM_SMTP_PORT:-587}
      BSM_SMTP_USER: ${BSM_SMTP_USER:-}
      BSM_SMTP_PASSWORD: ${BSM_SMTP_PASSWORD:-}
      BSM_SMTP_FROM: ${BSM_SMTP_FROM:-}
      BSM_SMTP_TO: ${BSM_SMTP_TO:-}
      BSM_HEARTBEAT_STALE_AFTER: ${BSM_HEARTBEAT_STALE_AFTER:-20}
      BSM_WORKER_INTERVAL: ${BSM_WORKER_INTERVAL:-5}
    volumes:
      - bsm-data:/app/data:ro
      - bsm-logs:/app/logs
    networks:
      - default

  # Acces public (optionnel, COMPOSE_PROFILES=public dans .env) : HTTPS + mot de passe.
  # Seule entree publique : l'interface reste liee a 127.0.0.1. Aucune cle Binance ici.
  proxy:
    image: caddy:2-alpine
    profiles: ["public"]
    init: true
    # Caddy tourne en root pour ouvrir 80/443 : pas de cap_drop tant que ce n'est pas teste.
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on: [ui]
    entrypoint: ["sh", "/etc/caddy/deploy/proxy-entrypoint.sh"]
    environment:
      BSM_PUBLIC_HOST: ${BSM_PUBLIC_HOST:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Dossier entier (pas les fichiers) : make user-add remplace users.caddy et recharge.
      - ./deploy:/etc/caddy/deploy:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  # Outil ponctuel des cles (make master-key, make compte) : seul service qui peut ECRIRE la
  # cle maitresse. Aucun reseau, aucune variable de .env.
  keytool:
    <<: *hardening
    build: .
    image: binance-spot-manager:latest
    profiles: ["tools"]
    init: true
    network_mode: none
    environment:
      BSM_MASTER_KEY_FILE: /var/lib/bsm-keys/master.key
    volumes:
      - bsm-data:/app/data
      - bsm-keys:/var/lib/bsm-keys
    command: ["python", "scripts/cle_maitresse.py"]

  # Outils ponctuels (make test) : aucun volume, aucun secret.
  test:
    build: .
    image: binance-spot-manager:latest
    profiles: ["tools"]
    command: ["python", "-m", "pytest", "-m", "not integration", "-p", "no:cacheprovider"]

  # make integration : cles Demo, mais jamais les volumes de donnees reels.
  integration:
    build: .
    image: binance-spot-manager:latest
    profiles: ["tools"]
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "pytest", "tests/test_demo_integration.py", "-p", "no:cacheprovider"]

volumes:
  # Depot direct de signaux (docs/SIGNAUX.md) : le projet externe MLSignalGenerator
  # monte ce volume sous son nom complet `binance-spot-manager_bsm-data` (volume
  # externe dans son propre compose) et doit tourner avec l'uid 10001 (bsm). Il
  # n'ecrit que dans signal_drop/incoming/ ; le worker cree l'arborescence.
  bsm-data:
  bsm-logs:
  # Cle maitresse du coffre : jamais dans bsm-data, donc jamais dans make backup.
  bsm-keys:
  # Certificats HTTPS : a conserver, sinon Let's Encrypt en reemet (limites de frequence).
  caddy-data:
  caddy-config:

networks:
  default: {}
  # Reseau partage avec CryptoSignalIntelligence, cree une fois par `make network`
  # (ou `docker network create csi-bridge`) ; aucun des deux projets ne le supprime.
  # Les services test et integration ne le rejoignent pas : ils tournent sans CSI.
  csi-bridge:
    name: csi-bridge
    external: true
